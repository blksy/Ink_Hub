<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edycja profilu | Artiva</title>
  </head>
  <body>
    <main class="container">
      <h1>Edytuj profil klienta</h1>
      <p>Zaktualizuj swoje dane osobowe.</p>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zapisz zmiany</button>
      </form>
      <a class="back" href="{% url 'clients:client-profile' %}">Wróć do profilu</a>
    </main>
  </body>
</html>
